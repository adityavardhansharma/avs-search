<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>AVS Search</title>
    <meta name="title" content="AVS Search - Privacy-Focused Google Alternative | Multi-Engine Search Without Tracking">
    <meta name="description" content="The best Google alternative with zero tracking, no ads, and multi-engine search. Switch between Web, Reddit, YouTube, AI Search, and more. Privacy-first search engine with Kagi Pro mode, Gemini AI integration, and bang commands.">
    <meta name="keywords" content="google alternative, google replacement, private search engine, privacy search, no tracking search, ad-free search, best search engine, DuckDuckGo alternative, Bing alternative, multi-engine search, anonymous search, secure search, unduck search, kagi search, AI search engine, gemini search, reddit search, youtube search, imdb search, amazon search, bang commands, privacy-focused search, search without ads, search without tracking, alternative to google, better than google, google competitor, meta search engine, search aggregator">
    <meta name="author" content="AVS Search">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="googlebot" content="index, follow">
    <meta name="bingbot" content="index, follow">
    <link rel="canonical" href="https://avssearch.vercel.app/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://avssearch.vercel.app/">
    <meta property="og:title" content="AVS Search - Privacy-Focused Google Alternative | No Tracking, No Ads">
    <meta property="og:description" content="Switch from Google to AVS Search: A privacy-first search engine with multi-engine support (Web, Reddit, YouTube, AI), zero tracking, and no advertisements. Features Pro mode with Kagi integration and Gemini AI search.">
    <meta property="og:image" content="https://avssearch.vercel.app/rocket.png">
    <meta property="og:image:alt" content="AVS Search - Privacy Search Engine Logo">
    <meta property="og:site_name" content="AVS Search">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://avssearch.vercel.app/">
    <meta name="twitter:title" content="AVS Search - Privacy-Focused Google Alternative">
    <meta name="twitter:description" content="The best Google alternative with zero tracking and no ads. Multi-engine search with AI integration, Pro mode, and bang commands for privacy-conscious users.">
    <meta name="twitter:image" content="https://avssearch.vercel.app/rocket.png">
    <meta name="twitter:creator" content="@AVSSearch">

    <!-- Additional SEO Meta Tags -->
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AVS Search">
    <meta name="application-name" content="AVS Search">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-config" content="/browserconfig.xml">

    <!-- Structured Data / JSON-LD for Rich Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AVS Search",
      "alternateName": ["AVS", "AVS Search Engine"],
      "url": "https://avssearch.vercel.app/",
      "description": "Privacy-focused multi-engine search platform - A Google alternative with no tracking, no ads, and integrated AI search capabilities",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://avssearch.vercel.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "mainEntity": {
        "@type": "SoftwareApplication",
        "name": "AVS Search",
        "applicationCategory": "SearchApplication",
        "operatingSystem": "Web Browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Multi-engine search (Web, Reddit, YouTube, IMDB, Amazon)",
          "AI-powered search with Gemini integration",
          "Zero tracking and no advertisements",
          "Pro mode with Kagi integration",
          "Bang command support",
          "Keyboard shortcuts",
          "Privacy-first architecture",
          "Mobile responsive design"
        ]
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "AVS Search",
      "url": "https://avssearch.vercel.app/",
      "logo": "https://avssearch.vercel.app/rocket.png",
      "description": "Building privacy-focused search solutions as an alternative to Google and other tracking-heavy search engines",
      "foundingDate": "2024",
      "sameAs": [
        "https://github.com/adityavardhansharma"
      ]
    }
    </script>

    <link rel="icon" type="image/png" href="/rocket.png">
    <script>
      window.va = window.va || function () {
        (window.vaq = window.vaq || []).push(arguments);
      };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="flex flex-col min-h-screen grid-background bg-black">
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
